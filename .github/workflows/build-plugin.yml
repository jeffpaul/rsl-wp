name: Build Plugin ZIP

permissions:
  contents: read

# Tagged releases are built and published by release.yml; this is for ad-hoc builds.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.1)'
        required: false
        default: 'dev'

jobs:
  build:
    name: Build Plugin ZIP
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        extensions: dom, curl, libxml, mbstring, zip

    - name: Cache Composer packages
      uses: actions/cache@v6
      with:
        path: vendor
        key: ${{ runner.os }}-php-8.1-${{ hashFiles('**/composer.lock') }}

    - name: Install production dependencies
      run: composer install --no-dev --optimize-autoloader --no-progress

    - name: Determine version
      id: version
      env:
        INPUT_VERSION: ${{ github.event.inputs.version }}
      run: |
        if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_VERSION" && "$INPUT_VERSION" != "dev" ]]; then
          VERSION="${INPUT_VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "Invalid version format: $VERSION (expected: x.y.z, x.y.z-suffix, or dev)"
            exit 1
          fi
        elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "Invalid version format in tag: $VERSION"
            exit 1
          fi
        else
          VERSION="dev-$(git rev-parse --short HEAD)"
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Building version: $VERSION"

    - name: Update plugin version
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        # Update version in main plugin file
        sed -i "s/Version: .*/Version: $VERSION/" rsl-wp.php
        sed -i "s/RSL_PLUGIN_VERSION\", \".*\"/RSL_PLUGIN_VERSION\", \"$VERSION\"/" rsl-wp.php
        
        # Update version in README.md if it has a version badge
        if grep -q "Version:" README.md; then
          sed -i "s/Version: .*/Version: $VERSION/" README.md
        fi

    - name: Create plugin ZIP
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        ZIP_NAME="rsl-licensing-$VERSION.zip"
        
        # Create temporary directory for plugin
        mkdir -p /tmp/rsl-licensing
        
        # Copy plugin files (exclude dev files and docs)
        rsync -av \
          --exclude='.git*' \
          --exclude='tests/' \
          --exclude='docs/' \
          --exclude='coverage/' \
          --exclude='test-logs/' \
          --exclude='test-report.html' \
          --exclude='.phpunit*' \
          --exclude='phpunit.xml' \
          --exclude='phpcs.xml*' \
          --exclude='composer.json' \
          --exclude='composer.lock' \
          --exclude='Makefile' \
          --exclude='AGENTS.md' \
          --exclude='IDEAS.md' \
          --exclude='SECURITY.md' \
          --exclude='agents.md' \
          --exclude='rsl-*.md' \
          --exclude='scripts/' \
          --exclude='.github/' \
          --exclude='node_modules/' \
          --exclude='.DS_Store' \
          --exclude='*.log' \
          ./ /tmp/rsl-licensing/
        
        # Create ZIP
        cd /tmp
        zip -r "$ZIP_NAME" rsl-licensing/
        mv "$ZIP_NAME" "$GITHUB_WORKSPACE/"
        
        echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT
        echo "zip_path=$GITHUB_WORKSPACE/$ZIP_NAME" >> $GITHUB_OUTPUT
        
        # Verify ZIP contents
        echo "ZIP contents:"
        unzip -l "$GITHUB_WORKSPACE/$ZIP_NAME" | head -20

    - name: Upload plugin ZIP as artifact
      uses: actions/upload-artifact@v7
      with:
        name: rsl-licensing-plugin-${{ steps.version.outputs.version }}
        path: rsl-licensing-*.zip
        retention-days: 30

    - name: Create checksums
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        ZIP_NAME="rsl-licensing-$VERSION.zip"
        
        # Create checksums
        sha256sum "$ZIP_NAME" > "${ZIP_NAME}.sha256"
        md5sum "$ZIP_NAME" > "${ZIP_NAME}.md5"
        
        echo "## Checksums" >> checksums.txt
        echo "" >> checksums.txt
        echo "**SHA256:** \`$(cat ${ZIP_NAME}.sha256)\`" >> checksums.txt
        echo "**MD5:** \`$(cat ${ZIP_NAME}.md5)\`" >> checksums.txt

    outputs:
      version: ${{ steps.version.outputs.version }}
      zip_name: rsl-licensing-${{ steps.version.outputs.version }}.zip